<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#020F22;}*{box-sizing:border-box;}a{color:#1FE3F5;}a:hover{color:#8FF3FB;}</style>
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;font-family:Manrope,sans-serif;color:#F2F0F8;">
  <dc-import name="Screen - Backups" show-menu="{{ false }}" hint-size="1280px,800px"></dc-import>
  <div style="position:absolute;inset:0;background:rgba(1,6,15,.66);display:flex;align-items:center;justify-content:center;">
    <div style="width:640px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:#06152B;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.55);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 16px;border-bottom:1px solid rgba(255,255,255,.08);">
        <div>
          <div style="font-size:18px;font-weight:800;">Monthly archive · October 2026</div>
          <div style="font-size:12.5px;color:#A9A6C4;margin-top:3px;">First 2 backups per job copied to <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#D9D7EA;">D:\Backups\FOTM</span></div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9A6C4" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </div>
      <div style="display:flex;gap:28px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;">
        <span><span style="font-weight:800;font-size:15px;">7</span> <span style="color:#A9A6C4;">complete</span></span>
        <span><span style="font-weight:800;font-size:15px;color:#fbbf24;">1</span> <span style="color:#A9A6C4;">partial</span></span>
        <span><span style="font-weight:800;font-size:15px;color:#f87171;">1</span> <span style="color:#A9A6C4;">missing</span></span>
      </div>
      <div style="padding:4px 0 8px;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
          <div style="padding:10px 22px 4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:#8A85AB;">{{ g.n }}</div>
          <sc-for list="{{ g.jobs }}" as="j" hint-placeholder-count="2">
            <div style="display:grid;grid-template-columns:minmax(0,1fr) 44px 190px;gap:12px;align-items:center;height:34px;padding:0 22px;">
              <span style="font-size:13px;font-weight:600;">{{ j.n }}</span>
              <span style="display:flex;gap:4px;"><span style="width:14px;height:6px;border-radius:2px;background:{{ j.p1 }};"></span><span style="width:14px;height:6px;border-radius:2px;background:{{ j.p2 }};"></span></span>
              <span style="font-size:12.5px;color:{{ j.c }};text-align:right;font-variant-numeric:tabular-nums;">{{ j.d }}</span>
            </div>
          </sc-for>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid rgba(255,255,255,.08);background:#071A33;">
        <span style="font-size:12.5px;color:#A9A6C4;">Run monthly copies any missing items now.</span>
        <div style="flex:1;"></div>
        <button style="height:34px;padding:0 13px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#061730;color:#D9D7EA;font:600 13px Manrope;">Close</button>
        <button style="height:34px;padding:0 15px;border-radius:6px;border:none;background:#DD3DEE;color:#16031C;font:800 13px Manrope;">Run monthly</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const J = (n, k, d) => ({ n, d, p1: k >= 1 ? '#34d399' : '#1A2C47', p2: k >= 2 ? '#34d399' : k === 1 ? '#fbbf24' : '#1A2C47', c: k === 2 ? '#A9A6C4' : k === 1 ? '#fbbf24' : '#f87171' });
    return { groups: [
      { n: 'ASA Legacy', jobs: [J('LNA_TheIsland', 2, 'Oct 1, 12:00 AM · 12:30 AM'), J('LNA_Center', 2, 'Oct 1, 12:01 AM · 12:31 AM'), J('LNA_LostColony_2', 2, 'Oct 1, 12:05 AM · 12:35 AM')] },
      { n: 'ASE Legacy', jobs: [J('Ragnarok_Main', 2, 'Oct 1, 12:20 AM · 12:50 AM'), J('Fjordur_PvP', 0, 'No copies, last run failed'), J('Valguero_PvE', 1, '1 of 2 · paused since Oct 1')] },
      { n: 'Minecraft', jobs: [J('SMP_Survival', 2, 'Oct 1, 12:04 AM · 12:14 AM'), J('Cobblemon_Main', 2, 'Oct 1, 12:03 AM · 12:33 AM')] },
      { n: 'Palworld', jobs: [J('Palworld_Main', 2, 'Oct 1, 12:29 AM · 12:59 AM')] },
    ]};
  }
}
</script>
</body>
</html>
